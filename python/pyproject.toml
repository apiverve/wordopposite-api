[project]
name = "apiverve-wordopposites"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Word Opposites looks up direct antonyms for any single input term. Pass an English word to receive an array of contrasting and opposing words."
keywords = ["antonyms api", "find antonyms", "word opposites", "lookup opposite words", "get antonym of word"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/wordopposite?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/wordopposite?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/wordopposite-api"
Twitter = "https://twitter.com/apivervehq"
